<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbe Adventure: Genetika & Metabolisme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Microbe Quest: Genetic & Metabolic Adventure</h1>

    <div id="game-container">
        <div class="info-bar">
            <div id="control-hint">Fitur Kontrol: <span id="control-method">W-A-S-D</span></div>
            <div>Skor: <span id="score-count" style="color: #ffb423;">0</span> / 150</div>
        </div>

        <div id="message-overlay">
            <div class="overlay-card">
                <h2 id="overlay-title">Pemberitahuan</h2>
                <p id="overlay-text" style="margin: 15px 0; font-size: 16px;"></p>
                <button id="overlay-close-btn" type="button" onclick="closeOverlay()">Lanjut</button>
            </div>
        </div>

        <div id="quiz-screen" class="screen active">
            <div class="question-box">
                <div id="question-index">Soal 1 / 15</div>
                <div id="question-text" style="margin-top:8px; font-size:18px; font-weight:700;"></div>
            </div>

            <div id="canvas-zone">
                <div id="gate-A" class="gate option" data-option="A">A</div>
                <div id="gate-B" class="gate option" data-option="B">B</div>
                <div id="gate-C" class="gate option" data-option="C">C</div>
                <div id="gate-D" class="gate option" data-option="D">D</div>
                <div id="player">👾</div>
            </div>
        </div>

        <div id="screen-ending" class="screen">
            <div class="question-box" style="background: #4ecca3; color: #1a1a2e;">
                <h2>MISI SELESAI!</h2>
            </div>
            <div style="text-align:center; margin-top: 12px;">
                <label>Nama Pemain: <input id="player-name" type="text" placeholder="Masukkan nama..." style="padding:6px 8px; border-radius:8px; border:1px solid rgba(0,0,0,0.1);"></label>
            </div>
            <h3 style="text-align: center; color: #ffb423; font-size: 22px; margin-top:12px;">
                Skor Anda: <span id="final-score">0</span> / 150
            </h3>
            <h4 style="text-align:center; color:#dfefff;" id="final-grade">Predikat: -</h4>
            <p id="final-msg" style="text-align:center; color:#cfe8ff; margin:12px 20px;">Pesan motivasi akan muncul di sini.</p>
            <div style="text-align:center; margin-top:14px;"><button type="button" onclick="resetGame()">Main Lagi</button></div>
        </div>

    </div>

    <div id="joystick-container">
        <div id="joystick-base" class="joystick-base">
            <div id="joystick-thumb" class="joystick-thumb"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
